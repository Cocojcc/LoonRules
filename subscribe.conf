# 贴进 Loon 配置的 [Remote Rule]
# 越靠上优先级越高。自己的列表放在 blackmatrix7 那些大列表前面。
#
# 用法二选一：
# 1) 本地调试：在本仓库根目录执行
#    python3 -m http.server 8765
#    下面地址即可用
# 2) 推到 GitHub 后，把 127.0.0.1:8765 换成
#    https://raw.githubusercontent.com/<你的用户名>/<仓库名>/main

[Remote Rule]
http://127.0.0.1:8765/rules/reject.list, policy=REJECT, tag=MyReject, enabled=true
http://127.0.0.1:8765/rules/lan.list, policy=DIRECT, tag=MyLAN, enabled=true
http://127.0.0.1:8765/rules/personal.list, policy=DIRECT, tag=MyPersonal, enabled=true
http://127.0.0.1:8765/rules/ai.list, policy=Available, tag=MyAI, enabled=true
http://127.0.0.1:8765/rules/streaming.list, policy=Streaming, tag=MyStreaming, enabled=true
http://127.0.0.1:8765/rules/telegram.list, policy=Available, tag=MyTelegram, enabled=true
http://127.0.0.1:8765/rules/twitter.list, policy=Available, tag=MyTwitter, enabled=true
http://127.0.0.1:8765/rules/google.list, policy=Available, tag=MyGoogle, enabled=true
http://127.0.0.1:8765/rules/github.list, policy=Available, tag=MyGitHub, enabled=true
http://127.0.0.1:8765/rules/apple.list, policy=DIRECT, tag=MyApple, enabled=true
http://127.0.0.1:8765/rules/proxy.list, policy=Available, tag=MyProxy, enabled=true
http://127.0.0.1:8765/rules/direct.list, policy=DIRECT, tag=MyDirect, enabled=true
