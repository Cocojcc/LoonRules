# 贴进 Loon 配置的 [Remote Rule]
# 越靠上优先级越高。
#
# 翻墙全部走 Available（你现在唯一的 VPN 策略组）。
# 本地调试：仓库根目录 python3 -m http.server 8765
# 推到 GitHub 后把 127.0.0.1:8765 换成 raw 地址

[Remote Rule]
http://127.0.0.1:8765/rules/reject.list, policy=REJECT, tag=MyReject, enabled=true
http://127.0.0.1:8765/rules/lan.list, policy=DIRECT, tag=MyLAN, enabled=true
http://127.0.0.1:8765/rules/personal.list, policy=DIRECT, tag=MyPersonal, enabled=true
http://127.0.0.1:8765/rules/ai.list, policy=Available, tag=MyAI, enabled=true
http://127.0.0.1:8765/rules/proxy.list, policy=Available, tag=MyProxy, enabled=true
http://127.0.0.1:8765/rules/direct.list, policy=DIRECT, tag=MyDirect, enabled=true
