# 贴进 Loon 配置的 [Remote Rule]
# 越靠上优先级越高。翻墙全部走 Available。

[Remote Rule]
https://luffy.cc/loon/rules/reject.list, policy=REJECT, tag=MyReject, enabled=true
https://luffy.cc/loon/rules/direct.list, policy=DIRECT, tag=MyDirect, enabled=true
https://luffy.cc/loon/rules/ai.list, policy=Available, tag=MyAI, enabled=true
https://luffy.cc/loon/rules/proxy.list, policy=Available, tag=MyProxy, enabled=true
